<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sprkwash – Business Card Back</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #e8edf2;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'DM Sans', sans-serif;
    }

    .card {
      width: 840px;
      height: 480px;
      border-radius: 24px;
      background: #F5F9FF;
      border: 2px solid #C7DCFA;
      position: relative;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.18);
    }

    /* Subtle top stripe */
    .top-stripe {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 7px;
      background: linear-gradient(90deg, #1D6FE8, #60A5FA);
    }

    /* Light circle decoration */
    .circle-deco {
      position: absolute;
      bottom: -100px; right: -100px;
      width: 340px; height: 340px;
      border-radius: 50%;
      background: #1D6FE8;
      opacity: 0.05;
    }
    .circle-deco-2 {
      position: absolute;
      bottom: -60px; right: -60px;
      width: 200px; height: 200px;
      border-radius: 50%;
      background: #1D6FE8;
      opacity: 0.06;
    }

    .content {
      position: relative;
      z-index: 2;
      padding: 56px 66px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Logo */
    .logo {
      font-family: 'Syne', sans-serif;
      font-size: 30px;
      font-weight: 800;
      color: #0B1D3A;
      letter-spacing: -0.5px;
    }
    .logo span { color: #1D6FE8; }

    /* Services */
    .services-label {
      font-size: 11px;
      color: #94A3B8;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      margin-bottom: 14px;
    }
    .tags { display: flex; flex-wrap: wrap; gap: 10px; }
    .tag {
      background: #EEF4FF;
      border: 1.5px solid #C7DCFA;
      border-radius: 100px;
      font-size: 14px;
      font-weight: 500;
      color: #1558C0;
      padding: 7px 18px;
    }

    /* Bottom */
    .bottom { display: flex; justify-content: space-between; align-items: flex-end; }
    .url {
      font-family: 'Syne', sans-serif;
      font-size: 18px;
      font-weight: 700;
      color: #1D6FE8;
    }
    .eco {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #64748B;
    }
    .green-dot {
      width: 9px; height: 9px;
      background: #16A34A;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* Print styles */
    @media print {
      body { background: white; margin: 0; }
      .card {
        width: 3.5in; height: 2in;
        border-radius: 0;
        box-shadow: none;
      }
      .content { padding: 0.22in 0.26in; }
      .logo { font-size: 0.2in; }
      .services-label { font-size: 0.07in; }
      .tag { font-size: 0.08in; padding: 0.03in 0.1in; }
      .url { font-size: 0.12in; }
      .eco { font-size: 0.07in; }
      .top-stripe { height: 0.04in; }
    }
  </style>
</head>
<body>

<div class="card">
  <div class="top-stripe"></div>
  <div class="circle-deco"></div>
  <div class="circle-deco-2"></div>

  <div class="content">
    <!-- Logo -->
    <div class="logo">sprk<span>wash</span></div>

    <!-- Services -->
    <div>
      <p class="services-label">What We Clean</p>
      <div class="tags">
        <div class="tag">Driveways</div>
        <div class="tag">Patios &amp; Decks</div>
        <div class="tag">Sidewalks</div>
        <div class="tag">Trash Cans</div>
        <div class="tag">Garage Floors</div>
      </div>
    </div>

    <!-- Bottom -->
    <div class="bottom">
      <div class="url">sprkwash.netlify.app</div>
      <div class="eco">
        <div class="green-dot"></div>
        Eco-friendly &middot; We ride to you
      </div>
    </div>
  </div>
</div>

</body>
</html>
