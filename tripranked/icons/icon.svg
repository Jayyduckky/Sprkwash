<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111a24"/>
      <stop offset="1" stop-color="#0a0e13"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1db571"/>
      <stop offset="1" stop-color="#5cf0ae"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect x="10" y="10" width="492" height="492" rx="106" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="4"/>
  <!-- gauge track: 240° sweep -->
  <path d="M 123.9 358.2 A 152 152 0 1 1 388.1 358.2"
        fill="none" stroke="#1d2833" stroke-width="46" stroke-linecap="round"/>
  <!-- gauge fill ~70% -->
  <path d="M 123.9 358.2 A 152 152 0 1 1 388.1 358.2"
        fill="none" stroke="url(#arc)" stroke-width="46" stroke-linecap="round"
        pathLength="100" stroke-dasharray="72 28"/>
  <!-- needle pointing to the fill tip (~top right) -->
  <g>
    <line x1="256" y1="286" x2="366" y2="182" stroke="#eef4f8" stroke-width="26" stroke-linecap="round"/>
    <circle cx="256" cy="286" r="40" fill="#eef4f8"/>
    <circle cx="256" cy="286" r="18" fill="#0a0e13"/>
  </g>
  <!-- rank bars, bottom -->
  <g fill="#24313f">
    <rect x="156" y="380" width="44" height="52" rx="10"/>
    <rect x="312" y="392" width="44" height="40" rx="10"/>
  </g>
  <rect x="234" y="356" width="44" height="76" rx="10" fill="url(#arc)"/>
</svg>
