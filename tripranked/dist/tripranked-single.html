  <style>
/* ═══════════════ TripRanked — dark cockpit theme ═══════════════ */

:root {
  --bg: #0a0e13;
  --bg2: #0d131b;
  --panel: #121a23;
  --panel2: #17212c;
  --line: rgba(255, 255, 255, .07);
  --txt: #eef4f8;
  --dim: #8fa0ae;
  --dim2: #5b6a76;
  --acc: #3dd68c;
  --acc-soft: rgba(61, 214, 140, .14);
  --blue: #59b7ff;
  --amber: #ffb020;
  --red: #ff5d5d;
  --gold: #ffd45e;
  --r: 18px;
  --tabbar-h: 62px;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body { height: 100%; }

body {
  background: var(--bg);
  color: var(--txt);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}

button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
b { font-weight: 700; }
small { font-size: .62em; font-weight: 600; color: var(--dim); }
.hidden { display: none !important; }
.dim { color: var(--dim); }

#app {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  position: relative;
  background:
    radial-gradient(120% 50% at 50% -10%, #14202b 0%, transparent 60%),
    var(--bg);
}

@media (min-width: 560px) {
  body { background: #05070a; }
  #app {
    min-height: 100vh;
    border-left: 1px solid var(--line);
    border-right: 1px solid var(--line);
    box-shadow: 0 0 80px rgba(0, 0, 0, .6);
  }
}

/* ─────────── top bar ─────────── */

.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: calc(10px + env(safe-area-inset-top)) 18px 10px;
  position: sticky; top: 0; z-index: 20;
  background: linear-gradient(rgba(10, 14, 19, .92), rgba(10, 14, 19, .75));
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

.brand { font-weight: 900; font-size: 19px; letter-spacing: .4px; }
.brand .bolt { margin-right: 4px; }
.brand-accent { color: var(--acc); }

.chip {
  font-size: 11.5px; font-weight: 700; letter-spacing: .6px;
  padding: 5px 11px; border-radius: 999px;
  background: var(--panel); border: 1px solid var(--line); color: var(--dim);
  transition: all .25s;
}
.chip-hidden { opacity: 0; }
.chip.ok    { color: var(--acc);  border-color: rgba(61, 214, 140, .4);  background: var(--acc-soft); }
.chip.warn  { color: var(--amber); border-color: rgba(255, 176, 32, .4); background: rgba(255, 176, 32, .1); }
.chip.bad   { color: var(--red);  border-color: rgba(255, 93, 93, .4);   background: rgba(255, 93, 93, .1); }
.chip.pulse { animation: chipPulse 1.2s ease-in-out infinite; }
@keyframes chipPulse { 50% { opacity: .45; } }

/* ─────────── screens ─────────── */

main { flex: 1; }

.screen {
  display: none;
  padding: 8px 18px calc(var(--tabbar-h) + 26px + env(safe-area-inset-bottom));
  animation: fadeUp .22s ease;
}
.screen.active { display: block; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } }

.screen-head {
  display: flex; align-items: center; justify-content: space-between;
  margin: 10px 2px 14px;
}
.screen-head h2 { font-size: 24px; font-weight: 850; letter-spacing: .2px; }

.pill {
  font-size: 10.5px; font-weight: 800; letter-spacing: .8px;
  padding: 4px 10px; border-radius: 999px;
  background: var(--acc-soft); color: var(--acc);
  border: 1px solid rgba(61, 214, 140, .25);
}

/* ─────────── gauge ─────────── */

.gauge-wrap { position: relative; margin: 6px auto 0; max-width: 340px; }
#gauge { width: 100%; display: block; }

.gauge-track {
  fill: none; stroke: var(--panel2); stroke-width: 14; stroke-linecap: round;
}
.gauge-fill {
  fill: none; stroke: url(#gaugeGrad); stroke-width: 14; stroke-linecap: round;
  stroke: var(--acc);
  stroke-dasharray: 100;
  stroke-dashoffset: 100;
  transition: stroke-dashoffset .25s linear, stroke .4s;
  filter: drop-shadow(0 0 8px rgba(61, 214, 140, .45));
}
.gauge-fill.hot { stroke: var(--amber); filter: drop-shadow(0 0 8px rgba(255, 176, 32, .5)); }

#gaugeTicks text {
  fill: var(--dim2); font-size: 10.5px; font-weight: 700;
  font-family: inherit;
}

.gauge-center {
  position: absolute; inset: 0; top: 18%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  pointer-events: none;
}
.speed-now {
  font-size: clamp(64px, 21vw, 88px);
  font-weight: 900; line-height: 1; letter-spacing: -2px;
  font-variant-numeric: tabular-nums;
  text-shadow: 0 0 30px rgba(61, 214, 140, .25);
}
.speed-unit { font-size: 15px; font-weight: 700; color: var(--dim); letter-spacing: 2px; text-transform: uppercase; }

.gauge-sub {
  text-align: center; font-size: 13px; font-weight: 600; color: var(--dim);
  margin: 2px 0 14px; min-height: 18px;
}
.dot-sep { margin: 0 6px; color: var(--dim2); }

/* ─────────── live tiles ─────────── */

.live-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.tile {
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  padding: 10px 8px 9px; text-align: center;
}
.tile-label { font-size: 10px; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase; color: var(--dim2); }
.tile-value { font-size: 19px; font-weight: 800; margin-top: 3px; font-variant-numeric: tabular-nums; }

.drive-lower {
  display: flex; align-items: center; gap: 14px;
  margin: 14px 0 6px; min-height: 92px;
}

/* g-force bubble */
.gmeter { position: relative; width: 92px; height: 92px; flex: 0 0 auto; }
.gmeter-ring {
  position: absolute; inset: 0; border-radius: 50%;
  border: 1.5px solid var(--line); background: radial-gradient(circle, var(--panel) 30%, var(--bg2));
}
.gmeter-cross {
  position: absolute; inset: 0;
  background:
    linear-gradient(var(--line), var(--line)) center/1px 76% no-repeat,
    linear-gradient(var(--line), var(--line)) center/76% 1px no-repeat;
  border-radius: 50%;
}
.gmeter-dot {
  position: absolute; left: 50%; top: 50%; width: 14px; height: 14px;
  border-radius: 50%; background: var(--acc);
  box-shadow: 0 0 10px rgba(61, 214, 140, .8);
  transform: translate(-50%, -50%);
  transition: transform .18s linear, background .2s;
}
.gmeter-dot.hard { background: var(--red); box-shadow: 0 0 10px rgba(255, 93, 93, .8); }
.gmeter-label {
  position: absolute; top: 7px; left: 0; right: 0; text-align: center;
  font-size: 9px; font-weight: 800; color: var(--dim2); letter-spacing: 1px;
}
.gmeter-val {
  position: absolute; bottom: 7px; left: 0; right: 0; text-align: center;
  font-size: 10.5px; font-weight: 700; color: var(--dim); font-variant-numeric: tabular-nums;
}

.events-live { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; flex: 1; }
.ev-chip {
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  padding: 8px 12px; font-size: 13.5px; display: flex; justify-content: space-between; align-items: center;
}
.ev-chip b { font-size: 15px; font-variant-numeric: tabular-nums; }
.ev-chip.flash { animation: evFlash .6s ease; }
@keyframes evFlash { 0% { background: rgba(255, 93, 93, .35); } }

/* ─────────── buttons ─────────── */

.drive-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }

.btn {
  border-radius: 16px; font-weight: 800; letter-spacing: .5px;
  padding: 13px 18px; font-size: 15px;
  transition: transform .08s, filter .15s, opacity .2s;
  user-select: none;
}
.btn:active { transform: scale(.975); }
.btn-big { padding: 17px 18px; font-size: 17px; }
.btn-primary {
  background: linear-gradient(135deg, #2fe08d, #1db571);
  color: #04160d;
  box-shadow: 0 6px 22px rgba(61, 214, 140, .35);
}
.btn-danger {
  background: linear-gradient(135deg, #ff6a5f, #e03131);
  color: #fff;
  box-shadow: 0 6px 22px rgba(255, 93, 93, .3);
}
.btn-ghost { background: var(--panel); border: 1px solid var(--line); color: var(--dim); font-weight: 700; }
.btn-ghost:hover { color: var(--txt); }
.btn-soft { background: var(--panel2); border: 1px solid var(--line); color: var(--txt); }
.btn[disabled] { opacity: .5; pointer-events: none; }

.gps-help {
  margin-top: 12px; padding: 12px 14px; border-radius: 14px;
  background: rgba(255, 176, 32, .08); border: 1px solid rgba(255, 176, 32, .25);
  color: #ffd9a0; font-size: 13.5px; line-height: 1.45;
}

.safety {
  margin-top: 16px; text-align: center;
  font-size: 11.5px; color: var(--dim2); line-height: 1.5; padding: 0 8px;
}

/* recording pulse on the Drive tab */
.tab .rec-dot {
  position: absolute; top: 6px; right: calc(50% - 16px);
  width: 8px; height: 8px; border-radius: 50%; background: var(--red);
  animation: chipPulse 1s infinite;
}

/* ─────────── segmented controls ─────────── */

.seg {
  display: flex; background: var(--panel); border: 1px solid var(--line);
  border-radius: 13px; padding: 4px; gap: 4px; margin-bottom: 10px;
}
.seg button {
  flex: 1; padding: 9px 4px; border-radius: 10px;
  font-size: 13.5px; font-weight: 750; color: var(--dim);
  transition: all .18s;
}
.seg button.on { background: var(--panel2); color: var(--txt); box-shadow: inset 0 0 0 1px rgba(61, 214, 140, .35); }
.seg-mini button { padding: 7px 4px; font-size: 12.5px; }

/* ─────────── leaderboard ─────────── */

.lb-loading { text-align: center; color: var(--dim); padding: 40px 0; }

.podium {
  display: grid; grid-template-columns: 1fr 1.15fr 1fr; gap: 8px;
  align-items: end; margin: 16px 0 14px;
}
.pod {
  background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
  text-align: center; padding: 14px 6px 12px; position: relative;
}
.pod.p1 { background: linear-gradient(180deg, rgba(255, 212, 94, .12), var(--panel)); border-color: rgba(255, 212, 94, .35); padding-top: 20px; }
.pod.p2 { background: linear-gradient(180deg, rgba(200, 210, 220, .08), var(--panel)); }
.pod.p3 { background: linear-gradient(180deg, rgba(205, 137, 80, .08), var(--panel)); }
.pod.you-glow { box-shadow: 0 0 0 1.5px var(--acc); }
.pod-medal { font-size: 20px; }
.pod-ava { font-size: 30px; line-height: 1.2; }
.pod-name { font-size: 12.5px; font-weight: 750; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 4px; }
.pod-val { font-size: 14px; font-weight: 850; color: var(--acc); margin-top: 3px; font-variant-numeric: tabular-nums; }
.pod-val small { color: var(--dim); }

.lb-row {
  display: flex; align-items: center; gap: 11px;
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 14px; padding: 10px 13px; margin-bottom: 7px;
}
.lb-row.you {
  background: linear-gradient(90deg, var(--acc-soft), var(--panel)), var(--bg2);
  border-color: rgba(61, 214, 140, .45);
  position: sticky; bottom: calc(var(--tabbar-h) + 10px + env(safe-area-inset-bottom)); top: 64px;
  z-index: 5; box-shadow: 0 4px 18px rgba(0, 0, 0, .45);
}
.lb-rank { width: 30px; text-align: center; font-weight: 850; color: var(--dim); font-variant-numeric: tabular-nums; flex: 0 0 auto; }
.lb-rank.medal { font-size: 17px; }
.lb-ava { font-size: 21px; flex: 0 0 auto; }
.lb-name { flex: 1; min-width: 0; font-weight: 700; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lb-name .flag { margin-left: 5px; font-size: 13px; }
.lb-name .you-tag { color: var(--acc); font-size: 11px; font-weight: 800; letter-spacing: .5px; margin-left: 6px; }
.lb-val { font-weight: 850; font-size: 14.5px; font-variant-numeric: tabular-nums; }
.lb-val small { color: var(--dim); font-size: .72em; }
.lb-gap { text-align: center; color: var(--dim2); margin: 4px 0 10px; letter-spacing: 3px; }
.lb-note { text-align: center; font-size: 11.5px; color: var(--dim2); margin: 14px 6px 4px; line-height: 1.5; }

/* ─────────── history ─────────── */

.hist-totals {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px;
}
.hist-totals .tile { padding: 9px 4px 8px; }
.hist-totals .tile-value { font-size: 15.5px; }

.trip-card {
  display: flex; align-items: center; gap: 12px;
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 16px; padding: 13px 14px; margin-bottom: 9px;
  cursor: pointer; transition: border-color .15s, transform .08s;
}
.trip-card:active { transform: scale(.985); }
.trip-card:hover { border-color: rgba(61, 214, 140, .35); }
.trip-ico { font-size: 24px; flex: 0 0 auto; }
.trip-main { flex: 1; min-width: 0; }
.trip-title { font-weight: 750; font-size: 14.5px; display: flex; align-items: center; gap: 7px; }
.trip-when { font-size: 12px; color: var(--dim); margin-top: 2px; }
.trip-sub { font-size: 12px; color: var(--dim); margin-top: 4px; }
.trip-right { text-align: right; flex: 0 0 auto; }
.trip-dist { font-weight: 850; font-size: 16.5px; font-variant-numeric: tabular-nums; }
.trip-dist small { font-size: .65em; }

.badge {
  font-size: 9.5px; font-weight: 800; letter-spacing: .6px;
  padding: 2.5px 7px; border-radius: 999px;
}
.badge-demo { background: rgba(89, 183, 255, .15); color: var(--blue); border: 1px solid rgba(89, 183, 255, .3); }
.badge-score { border: 1px solid var(--line); color: var(--dim); background: var(--bg2); }
.badge-score.good { color: var(--acc); border-color: rgba(61, 214, 140, .35); }
.badge-score.mid { color: var(--amber); border-color: rgba(255, 176, 32, .35); }
.badge-score.bad { color: var(--red); border-color: rgba(255, 93, 93, .35); }

.empty {
  text-align: center; padding: 48px 24px; color: var(--dim);
  line-height: 1.6; font-size: 14px;
}
.empty .big { font-size: 40px; display: block; margin-bottom: 10px; }

/* ─────────── profile ─────────── */

.pro-head { display: flex; align-items: center; gap: 16px; margin: 14px 2px 18px; }
.pro-ava {
  width: 74px; height: 74px; border-radius: 50%; flex: 0 0 auto;
  display: flex; align-items: center; justify-content: center;
  font-size: 38px; background: var(--panel2);
  border: 2px solid rgba(61, 214, 140, .5);
  box-shadow: 0 0 24px rgba(61, 214, 140, .18);
}
.pro-name { font-size: 21px; font-weight: 850; display: flex; align-items: center; gap: 8px; }
.pro-tag { color: var(--dim); font-size: 13px; font-weight: 600; margin-top: 2px; }
.pro-edit { color: var(--acc); font-size: 12.5px; font-weight: 750; margin-top: 6px; }

.card {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--r); padding: 15px 16px; margin-bottom: 12px;
}
.card h3 {
  font-size: 11.5px; font-weight: 850; letter-spacing: 1.4px; text-transform: uppercase;
  color: var(--dim2); margin-bottom: 11px;
}

.tier-row { display: flex; align-items: center; gap: 13px; }
.tier-ico { font-size: 34px; }
.tier-name { font-weight: 850; font-size: 17px; }
.tier-next { font-size: 12px; color: var(--dim); margin-top: 2px; }
.tier-bar { height: 7px; border-radius: 4px; background: var(--bg2); margin-top: 12px; overflow: hidden; }
.tier-bar i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--acc), #7ef0b7); transition: width .5s ease; }

.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stat-grid .tile { text-align: left; padding: 11px 13px; }
.stat-grid .tile-value { font-size: 18px; }

.ach-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.ach {
  background: var(--bg2); border: 1px solid var(--line); border-radius: 13px;
  text-align: center; padding: 11px 6px 9px;
}
.ach.locked { opacity: .32; filter: grayscale(.7); }
.ach-ico { font-size: 23px; }
.ach-name { font-size: 10.5px; font-weight: 750; margin-top: 4px; }
.ach-desc { font-size: 9px; color: var(--dim); margin-top: 2px; line-height: 1.35; }

.set-row {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 11px 2px; border-bottom: 1px solid var(--line);
}
.set-row:last-child { border-bottom: none; }
.set-lbl { font-weight: 700; font-size: 14.5px; }
.set-sub { font-size: 11.5px; color: var(--dim); margin-top: 2px; }
.set-row .seg { margin: 0; width: 150px; flex: 0 0 auto; }
.set-row .seg button { padding: 6px 4px; font-size: 12px; }

.switch { position: relative; width: 48px; height: 28px; flex: 0 0 auto; }
.switch input { opacity: 0; width: 100%; height: 100%; position: absolute; cursor: pointer; z-index: 2; margin: 0; }
.switch i {
  position: absolute; inset: 0; border-radius: 999px; background: var(--panel2);
  border: 1px solid var(--line); transition: background .2s;
}
.switch i::after {
  content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px;
  border-radius: 50%; background: var(--dim); transition: all .2s;
}
.switch input:checked + i { background: var(--acc-soft); border-color: rgba(61, 214, 140, .4); }
.switch input:checked + i::after { left: 23px; background: var(--acc); }

.danger-link { color: var(--red); font-weight: 750; font-size: 13.5px; }
.about { text-align: center; font-size: 11px; color: var(--dim2); line-height: 1.7; margin: 18px 10px 8px; }

/* ─────────── tab bar ─────────── */

.tabbar {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 480px; z-index: 30;
  display: flex;
  background: rgba(13, 18, 25, .88);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
  height: calc(var(--tabbar-h) + env(safe-area-inset-bottom));
}
.tab {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; color: var(--dim2); position: relative; padding-top: 4px;
}
.tab svg { width: 23px; height: 23px; fill: currentColor; }
.tab span { font-size: 10px; font-weight: 750; letter-spacing: .3px; }
.tab.on { color: var(--acc); }

/* ─────────── modal & toast ─────────── */

.modal-back {
  position: fixed; inset: 0; z-index: 50;
  background: rgba(4, 6, 9, .72);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  display: flex; align-items: flex-end; justify-content: center;
  animation: fadeIn .18s ease;
}
@keyframes fadeIn { from { opacity: 0; } }

.modal {
  width: 100%; max-width: 480px; max-height: 92dvh; overflow-y: auto;
  background: var(--bg2); border: 1px solid var(--line);
  border-radius: 24px 24px 0 0;
  padding: 20px 20px calc(22px + env(safe-area-inset-bottom));
  animation: slideUp .25s cubic-bezier(.2, .8, .25, 1);
}
@keyframes slideUp { from { transform: translateY(60px); opacity: .4; } }

@media (min-width: 560px) {
  .modal-back { align-items: center; }
  .modal { border-radius: 24px; max-height: 86vh; }
}

.modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.modal-head h3 { font-size: 19px; font-weight: 850; }
.modal-x {

.sum-hero { text-align: center; margin: 6px 0 4px; }

.sum-grade.good { color: var(--acc); } .sum-grade.mid { color: var(--amber); } .sum-grade.bad { color: var(--red); }

<script>
/* TripRanked — shared utilities. Everything internal is SI: meters, m/s, milliseconds. */
'use strict';

const U = {
  MS_TO_KMH: 3.6,
  MS_TO_MPH: 2.236936,

  $(sel, root) { return (root || document).querySelector(sel); },
  $$(sel, root) { return Array.from((root || document).querySelectorAll(sel)); },

  esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[c]);
  },

  clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); },
  lerp(a, b, t) { return a + (b - a) * t; },

  uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  },

  /* ---- geo math ---- */

  // Distance in meters between two lat/lon points.
  haversine(lat1, lon1, lat2, lon2) {
    const R = 6371000, rad = Math.PI / 180;
    const dLat = (lat2 - lat1) * rad, dLon = (lon2 - lon1) * rad;
    const a = Math.sin(dLat / 2) ** 2 +
      Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.asin(Math.min(1, Math.sqrt(a)));
  },

  // Initial bearing in degrees (0..360) from point 1 to point 2.
  bearing(lat1, lon1, lat2, lon2) {
    const rad = Math.PI / 180;
    const y = Math.sin((lon2 - lon1) * rad) * Math.cos(lat2 * rad);
    const x = Math.cos(lat1 * rad) * Math.sin(lat2 * rad) -
      Math.sin(lat1 * rad) * Math.cos(lat2 * rad) * Math.cos((lon2 - lon1) * rad);
    return (Math.atan2(y, x) / rad + 360) % 360;
  },

  // Signed shortest angular difference a→b in degrees (-180..180).
  angDiff(a, b) {
    let d = (b - a) % 360;
    if (d > 180) d -= 360;
    if (d < -180) d += 360;
    return d;
  },

  compass(deg) {
    const dirs = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
    return dirs[Math.round(((deg % 360) + 360) % 360 / 45) % 8];
  },

  /* ---- units & formatting ---- */

  // speed m/s -> {v, unit} in user units
  speed(ms, units, digits = 0) {
    const v = ms * (units === 'kmh' ? U.MS_TO_KMH : U.MS_TO_MPH);
    return { v: v.toFixed(digits), unit: units === 'kmh' ? 'km/h' : 'mph' };
  },

  // distance meters -> {v, unit}
  dist(m, units, digits = 1) {
    if (units === 'kmh') {
      const km = m / 1000;
      return { v: km >= 100 ? Math.round(km).toString() : km.toFixed(digits), unit: 'km' };
    }
    const mi = m / 1609.344;
    return { v: mi >= 100 ? Math.round(mi).toString() : mi.toFixed(digits), unit: 'mi' };
  },

  fmtDuration(ms) {
    const s = Math.max(0, Math.floor(ms / 1000));
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = s % 60;
    const p = n => String(n).padStart(2, '0');
    return h > 0 ? `${h}:${p(m)}:${p(r)}` : `${m}:${p(r)}`;
  },

  fmtDurationLong(ms) {
    const s = Math.max(0, Math.round(ms / 1000));
    const h = Math.floor(s / 3600), m = Math.round((s % 3600) / 60);
    if (h > 0) return `${h}h ${m}m`;
    if (m > 0) return `${m} min`;
    return `${s}s`;
  },

  fmtClock(ts) {
    return new Date(ts).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  },

  fmtDate(ts) {
    return new Date(ts).toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' });
  },

  relDate(ts) {
    const d = new Date(ts), now = new Date();
    const day = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
    const diff = Math.round((day(now) - day(d)) / 86400000);
    if (diff === 0) return 'Today';
    if (diff === 1) return 'Yesterday';
    if (diff < 7) return d.toLocaleDateString([], { weekday: 'long' });
    return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
  },

  fmtInt(n) { return Math.round(n).toLocaleString(); },

  /* ---- deterministic PRNG (leaderboard field) ---- */

  hashStr(s) {
    let h = 2166136261;
    for (let i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  },

  mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  },

  // ISO week key like "2026-W28" — drives the weekly leaderboard shuffle.
  isoWeek(ts) {
    const d = new Date(ts ? ts : Date.now());
    const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    const dayNum = (t.getUTCDay() + 6) % 7;
    t.setUTCDate(t.getUTCDate() - dayNum + 3);
    const firstThu = new Date(Date.UTC(t.getUTCFullYear(), 0, 4));
    const week = 1 + Math.round(((t - firstThu) / 86400000 - 3 + ((firstThu.getUTCDay() + 6) % 7)) / 7);
    return `${t.getUTCFullYear()}-W${String(week).padStart(2, '0')}`;
  },

  // Start of the current ISO week (Monday 00:00 local).
  weekStart(ts) {
    const d = new Date(ts ? ts : Date.now());
    const day = (d.getDay() + 6) % 7;
    const m = new Date(d.getFullYear(), d.getMonth(), d.getDate() - day);
    return m.getTime();
  },

  haptic(pattern) {
    try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (_) { /* unsupported */ }
  },

  /* Draw a recorded trip path ([lat,lon,t,v][]) into a canvas rect.
   * Segments are colored by speed; start/end markers included. */
  drawRoute(ctx, path, x, y, w, h, opts = {}) {
    if (!path || path.length < 2) {
      ctx.save();
      ctx.fillStyle = opts.emptyColor || 'rgba(255,255,255,.25)';
      ctx.font = `${Math.round(h / 10)}px system-ui, sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillText('No route recorded', x + w / 2, y + h / 2);
      ctx.restore();
      return;
    }
    let minLat = Infinity, maxLat = -Infinity, minLon = Infinity, maxLon = -Infinity, maxV = 1;
    for (const p of path) {
      minLat = Math.min(minLat, p[0]); maxLat = Math.max(maxLat, p[0]);
      minLon = Math.min(minLon, p[1]); maxLon = Math.max(maxLon, p[1]);
      maxV = Math.max(maxV, p[3] || 0);
    }
    const midLat = (minLat + maxLat) / 2;
    const kx = Math.cos(midLat * Math.PI / 180);
    const spanX = Math.max((maxLon - minLon) * kx, 1e-6);
    const spanY = Math.max(maxLat - minLat, 1e-6);
    const pad = opts.pad != null ? opts.pad : Math.min(w, h) * 0.12;
    const scale = Math.min((w - pad * 2) / spanX, (h - pad * 2) / spanY);
    const ox = x + w / 2 - ((minLon + maxLon) / 2) * kx * scale;
    const oy = y + h / 2 + midLat * scale;
    const px = p => [ox + p[1] * kx * scale, oy - p[0] * scale];

    const speedColor = v => {
      const t = U.clamp(v / Math.max(8, maxV), 0, 1);
      // blue (slow) → green → amber (fast)
      const h1 = U.lerp(210, 145, Math.min(1, t * 2));
      const h2 = U.lerp(145, 40, Math.max(0, t * 2 - 1));
      return `hsl(${t < 0.5 ? h1 : h2} 90% 60%)`;
    };

    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    const lw = opts.lineWidth || Math.max(2, Math.min(w, h) / 70);
    if (opts.glow !== false) {
      ctx.shadowColor = 'rgba(61,214,140,.5)';
      ctx.shadowBlur = lw * 2.2;
    }
    for (let i = 1; i < path.length; i++) {
      const [ax, ay] = px(path[i - 1]);
      const [bx, by] = px(path[i]);
      ctx.strokeStyle = speedColor(path[i][3] || 0);
      ctx.lineWidth = lw;
      ctx.beginPath();
      ctx.moveTo(ax, ay);
      ctx.lineTo(bx, by);
      ctx.stroke();
    }
    ctx.shadowBlur = 0;
    const dot = (p, color) => {
      const [cx, cy] = px(p);
      ctx.beginPath();
      ctx.arc(cx, cy, lw * 1.6, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();
      ctx.lineWidth = Math.max(1.5, lw * 0.5);
      ctx.strokeStyle = 'rgba(10,14,19,.9)';
      ctx.stroke();
    };
    dot(path[0], '#3dd68c');
    dot(path[path.length - 1], '#ff5d5d');
    ctx.restore();
  }
};

</script>

      name: 'Driver',
      tag: 'TR-' + String(1000 + Math.floor(Math.random() * 9000)),
      emoji: EMOJIS[Math.floor(Math.random() * EMOJIS.length)],
      hue: Math.floor(Math.random() * 360),
      createdAt: Date.now()
    },
    settings: {
      units: 'mph',        // 'mph' | 'kmh'
      keepAwake: true,
      demoSeen: false
    },
    trips: []              // newest first
  });

  let state = null;

  function load() {
    if (state) return state;
    try {
      const raw = localStorage.getItem(KEY);
      state = raw ? Object.assign(defaults(), JSON.parse(raw)) : defaults();
      // deep-merge the two nested objects so new fields get defaults
      state.profile = Object.assign(defaults().profile, state.profile);
      state.settings = Object.assign(defaults().settings, state.settings);
      if (!Array.isArray(state.trips)) state.trips = [];
    } catch (_) {
      state = defaults();
    }
    return state;
  }

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(state));
    } catch (e) {
      // Storage full — drop the heaviest payload (old trip paths) and retry once.
      state.trips.slice(20).forEach(t => { t.path = []; t.speeds = []; });
      try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (_) { /* give up quietly */ }
    }
  }

  /* ---- trips ---- */

  function addTrip(trip) {
    load();
    state.trips.unshift(trip);
    if (state.trips.length > 200) state.trips.length = 200;
    save();
    return trip;
  }

  function deleteTrip(id) {
    load();
    state.trips = state.trips.filter(t => t.id !== id);
    save();
  }

  function getTrip(id) {
    return load().trips.find(t => t.id === id) || null;
  }

  /* ---- scoring ----
   * 100-point smoothness score, penalties normalized per 10 km so short
   * hops aren't graded more harshly than long drives.
   */
  function scoreTrip(t) {
    // floor at 3 km so a couple of events on a short hop doesn't nuke the grade
    const km = Math.max(3, t.distanceM / 1000);
    const per10 = n => (n / km) * 10;
    const penalty =
      per10(t.events.hardBrakes) * 2.5 +
      per10(t.events.hardAccels) * 2.0 +
      per10(t.events.hardCorners) * 1.5;
    return Math.round(U.clamp(100 - penalty, 0, 100));
  }

  function grade(score) {
    if (score >= 97) return 'A+';
    if (score >= 92) return 'A';
    if (score >= 85) return 'B+';
    if (score >= 78) return 'B';
    if (score >= 70) return 'C';
    if (score >= 60) return 'D';
    return 'F';
  }

  /* ---- aggregates ---- */

  function totals(sinceTs) {
    const trips = load().trips.filter(t => !sinceTs || t.startedAt >= sinceTs);
    const agg = {
      trips: trips.length,
      distanceM: 0,
      timeMs: 0,
      movingMs: 0,
      maxSpeedMs: 0,
      bestScore: 0,
      avgScore: 0,
      longestM: 0,
      events: { hardAccels: 0, hardBrakes: 0, hardCorners: 0, stops: 0 },
      maxG: 0
    };
    let wSum = 0, wScore = 0;
    for (const t of trips) {
      agg.distanceM += t.distanceM;
      agg.timeMs += t.durationMs;
      agg.movingMs += t.movingMs || t.durationMs;
      agg.maxSpeedMs = Math.max(agg.maxSpeedMs, t.maxSpeedMs);
      agg.bestScore = Math.max(agg.bestScore, t.score);
      agg.longestM = Math.max(agg.longestM, t.distanceM);
      agg.maxG = Math.max(agg.maxG, t.maxG || 0);
      for (const k in agg.events) agg.events[k] += (t.events && t.events[k]) || 0;
      const w = Math.max(0.5, t.distanceM / 1000);
      wSum += w; wScore += w * t.score;
    }
    agg.avgScore = wSum ? Math.round(wScore / wSum) : 0;
    return agg;
  }

  function streakDays() {
    const days = new Set(load().trips.map(t => new Date(t.startedAt).toDateString()));
    let streak = 0;
    const d = new Date();
    // allow the streak to count if today has no trip yet but yesterday does
    if (!days.has(d.toDateString())) d.setDate(d.getDate() - 1);
    while (days.has(d.toDateString())) { streak++; d.setDate(d.getDate() - 1); }
    return streak;
  }

  /* ---- rank tiers (progression by lifetime distance) ---- */

  const TIERS = [
    { name: 'Rookie',   icon: '🔰', atKm: 0 },
    { name: 'Bronze',   icon: '🥉', atKm: 50 },
    { name: 'Silver',   icon: '🥈', atKm: 200 },
    { name: 'Gold',     icon: '🥇', atKm: 500 },
    { name: 'Platinum', icon: '💠', atKm: 1500 },
    { name: 'Apex',     icon: '👑', atKm: 5000 }
  ];

  function tier(distanceM) {
    const km = distanceM / 1000;
    let cur = TIERS[0], next = null;
    for (let i = 0; i < TIERS.length; i++) {
      if (km >= TIERS[i].atKm) cur = TIERS[i];
      else { next = TIERS[i]; break; }
    }
    const base = cur.atKm, ceil = next ? next.atKm : cur.atKm;
    const progress = next ? U.clamp((km - base) / (ceil - base), 0, 1) : 1;
    return { ...cur, next, progress, km };
  }

  /* ---- achievements ---- */

  function achievements() {
    const t = totals();
    const trips = load().trips;
    const hasNight = trips.some(x => {
      const h = new Date(x.startedAt).getHours();
      return h >= 22 || h < 4;
    });
    const fast = (ms) => trips.some(x => x.maxSpeedMs >= ms);
    const smoothLong = trips.some(x => x.score >= 95 && x.distanceM >= 5000);
    return [
      { id: 'first',    icon: '🎉', name: 'First Trip',      desc: 'Complete your first drive',              earned: t.trips >= 1 },
      { id: 'ten',      icon: '🔟', name: 'Regular',          desc: 'Complete 10 trips',                      earned: t.trips >= 10 },
      { id: 'fifty',    icon: '🏋️', name: 'Road Warrior',     desc: 'Complete 50 trips',                      earned: t.trips >= 50 },
      { id: 'highway',  icon: '🛣️', name: 'Highway Legal',    desc: 'Reach highway speed (60+ mph)',          earned: fast(26.8) },
      { id: 'century',  icon: '💯', name: 'Century Club',     desc: '100 km lifetime distance',               earned: t.distanceM >= 100000 },
      { id: 'grand',    icon: '🌍', name: 'Globetrotter',     desc: '1,000 km lifetime distance',             earned: t.distanceM >= 1000000 },
      { id: 'marathon', icon: '🏜️', name: 'Long Hauler',      desc: 'A single trip of 100+ km',               earned: t.longestM >= 100000 },
      { id: 'smooth',   icon: '🧈', name: 'Smooth Operator',  desc: 'Score 95+ on a 5 km+ trip',              earned: smoothLong },
      { id: 'night',    icon: '🦉', name: 'Night Owl',        desc: 'Drive between 10 PM and 4 AM',           earned: hasNight },
      { id: 'streak3',  icon: '🔥', name: 'On a Streak',      desc: 'Drive 3 days in a row',                  earned: streakDays() >= 3 },
      { id: 'hour',     icon: '⏱️', name: 'Endurance',        desc: '10 hours total drive time',              earned: t.timeMs >= 36e6 },
      { id: 'clean',    icon: '✨', name: 'Flawless',         desc: 'A perfect 100 score trip',               earned: t.bestScore >= 100 }
    ];
  }

  /* ---- misc ---- */

  function tripName(startedAt) {
    const h = new Date(startedAt).getHours();
    if (h >= 5 && h < 12) return { name: 'Morning Drive', icon: '🌅' };
    if (h >= 12 && h < 17) return { name: 'Afternoon Drive', icon: '☀️' };
    if (h >= 17 && h < 21) return { name: 'Evening Drive', icon: '🌆' };
    return { name: 'Night Drive', icon: '🌙' };
  }

  function exportJSON() {
    return JSON.stringify(load(), null, 2);
  }

  function resetAll() {
    state = defaults();
    save();
  }

  return {
    load, save, addTrip, deleteTrip, getTrip,
    scoreTrip, grade, totals, streakDays, tier, achievements,
    tripName, exportJSON, resetAll,
    get profile() { return load().profile; },
    get settings() { return load().settings; },
    get trips() { return load().trips; }
  };
})();

</script>
<script>
/* TripRanked — GPS trip engine.
 *
 * Consumes GeolocationPosition fixes (real watchPosition or injected by the
 * demo simulator — identical pipeline either way), smooths speed, accumulates
 * distance/time, estimates longitudinal & lateral g from kinematics, and
 * detects driving events: hard acceleration, hard braking, hard cornering
 * and full stops.
 */
'use strict';

const Tracker = (() => {
  const T = () => window.TR_CONFIG.thresholds;

  let s = null;          // live trip state (null when idle)
  let watchId = null;
  let demoMode = false;

  const gps = { status: 'off', accuracy: null, error: '' }; // off|acquiring|ok|weak|denied|error

  function blank(now) {
    return {
      startedAt: now,
      lastFixAt: 0,
      // last accepted sample
      lat: null, lon: null, t: 0,
      // motion state
      speedMs: 0,          // smoothed
      rawSpeedMs: 0,
      accel: 0,            // smoothed longitudinal m/s²
      heading: NaN,
      headingOk: false,
      gLat: 0, gLon: 0,
      // accumulators
      distanceM: 0,
      movingMs: 0,
      maxSpeedMs: 0,
      maxG: 0,
      samples: 0,
      // events
      events: { hardAccels: 0, hardBrakes: 0, hardCorners: 0, stops: 0 },
      cooldown: { accel: 0, brake: 0, corner: 0 },
      hold: { accel: 0, brake: 0, corner: 0 },   // sustained-condition timers (s)
      stopped: true,
      stopHold: 0, moveHold: 0, hasMoved: false,
      // recordings
      path: [],            // [lat, lon, tRelSec, speedMs]
      speeds: [],          // [tRelSec, speedMs]
      pathT0: null,
      lastPathT: -1e9, lastPathLat: null, lastPathLon: null,
      lastSpeedT: -1e9
    };
  }

  /* ---- the sample pipeline ---- */

  function process(lat, lon, tMs, rawSpd, rawHeading, accuracy) {
    if (!s) return;
    const th = T();

    if (accuracy != null && accuracy > th.maxAccuracyM) {
      gps.status = 'weak'; gps.accuracy = accuracy;
      return; // fix too sloppy to trust
    }
    gps.status = 'ok'; gps.accuracy = accuracy;
    s.lastFixAt = Date.now();

    // First accepted fix — anchor only.
    if (s.lat === null) {
      s.lat = lat; s.lon = lon; s.t = tMs; s.pathT0 = tMs;
      recordPath(lat, lon, 0, 0);
      s.samples++;
      return;
    }

    let dt = (tMs - s.t) / 1000;
    if (dt <= 0.05) return;                    // duplicate / out-of-order fix
    if (dt > 10) {                             // signal gap — re-anchor, no phantom distance
      s.lat = lat; s.lon = lon; s.t = tMs;
      return;
    }

    const d = U.haversine(s.lat, s.lon, lat, lon);

    // Derived or reported speed (m/s)
    let v = (rawSpd != null && isFinite(rawSpd) && rawSpd >= 0) ? rawSpd : d / dt;
    // Physically implausible jump → clamp to a 12 m/s² envelope
    const maxDelta = 12 * dt;
    v = U.clamp(v, Math.max(0, s.rawSpeedMs - maxDelta), s.rawSpeedMs + maxDelta);
    s.rawSpeedMs = v;

    // Smooth speed (time-aware EMA, tau ≈ 1.2 s)
    const aV = 1 - Math.exp(-dt / 1.2);
    const prevSmooth = s.speedMs;
    s.speedMs = U.lerp(s.speedMs, v, aV);
    if (s.speedMs < 0.15) s.speedMs = 0;

    // Longitudinal acceleration (smoothed, tau ≈ 0.8 s)
    const rawA = (s.speedMs - prevSmooth) / dt;
    const aA = 1 - Math.exp(-dt / 0.8);
    s.accel = U.lerp(s.accel, rawA, aA);
    s.gLon = s.accel / 9.81;

    // Heading + lateral g (only meaningful while actually moving).
    // Smoothed (tau ≈ 0.5 s) and clamped so single-sample heading jumps —
    // GPS noise, tunnels, the works — can't fake impossible g readings.
    let hdg = (rawHeading != null && isFinite(rawHeading) && s.speedMs > 1.5) ? rawHeading
      : (d > 3 ? U.bearing(s.lat, s.lon, lat, lon) : NaN);
    let gLatRaw = 0;
    if (isFinite(hdg)) {
      if (s.headingOk && s.speedMs > 4) {
        const rate = U.clamp(U.angDiff(s.heading, hdg) / dt, -60, 60);  // deg/s
        gLatRaw = U.clamp((s.speedMs * rate * Math.PI / 180) / 9.81, -1.3, 1.3);
      }
      s.heading = hdg; s.headingOk = true;
    }
    const aG = 1 - Math.exp(-dt / 0.5);
    s.gLat = U.lerp(s.gLat, gLatRaw, aG);
    s.maxG = Math.max(s.maxG, Math.abs(s.gLat), Math.abs(s.gLon));

    // Distance & moving time (ignore GPS drift while parked)
    if (s.speedMs > th.moveSpeed && d < 120) {
      s.distanceM += d;
      s.movingMs += dt * 1000;
    }

    // Top speed (trust good fixes only)
    if (accuracy == null || accuracy <= 25) {
      s.maxSpeedMs = Math.max(s.maxSpeedMs, s.speedMs);
    }

    // ---- events (sustained ≥0.5 s + per-type cooldown) ----
    const now = tMs / 1000;
    const sustain = (key, cond) => {
      s.hold[key] = cond ? s.hold[key] + dt : 0;
      if (s.hold[key] >= 0.5 && now - s.cooldown[key] > th.eventCooldownMs / 1000) {
        s.cooldown[key] = now;
        s.hold[key] = 0;
        return true;
      }
      return false;
    };
    if (sustain('accel', s.accel > th.hardAccel && s.speedMs > 2)) s.events.hardAccels++;
    if (sustain('brake', s.accel < th.hardBrake && s.speedMs > 2)) s.events.hardBrakes++;
    if (sustain('corner', Math.abs(s.gLat) > th.hardCornerG && s.speedMs > 5)) s.events.hardCorners++;

    // Stops: moving → standstill (2.5 s under stopSpeed)
    if (s.speedMs < th.stopSpeed) {
      s.moveHold = 0;
      s.stopHold += dt;
      if (!s.stopped && s.stopHold >= 2.5) {
        s.stopped = true;
        if (s.hasMoved) s.events.stops++;
      }
    } else {
      s.stopHold = 0;
      s.moveHold += dt;
      if (s.moveHold >= 1) {
        s.stopped = false;
        if (s.speedMs > th.moveSpeed) s.hasMoved = true;
      }
    }

    // ---- recordings ----
    if (s.pathT0 == null) s.pathT0 = tMs;
    const tRel = (tMs - s.pathT0) / 1000;
    const dRec = (s.lastPathLat != null)
      ? U.haversine(s.lastPathLat, s.lastPathLon, lat, lon) : Infinity;
    if (dRec >= 15 || tRel - s.lastPathT >= 5) recordPath(lat, lon, tRel, s.speedMs);
    if (tRel - s.lastSpeedT >= 1) {
      s.speeds.push([Math.round(tRel), +s.speedMs.toFixed(2)]);
      s.lastSpeedT = tRel;
      if (s.speeds.length > 1800) s.speeds = s.speeds.filter((_, i) => i % 2 === 0);
    }

    s.lat = lat; s.lon = lon; s.t = tMs;
    s.samples++;
  }

  function recordPath(lat, lon, tRel, spd) {
    s.path.push([+lat.toFixed(6), +lon.toFixed(6), Math.round(tRel), +spd.toFixed(1)]);
    s.lastPathT = tRel; s.lastPathLat = lat; s.lastPathLon = lon;
    if (s.path.length > 2400) {
      const keepLast = s.path.pop();
      s.path = s.path.filter((_, i) => i % 2 === 0);
      s.path.push(keepLast);
    }
  }

  function onPosition(pos) {
    const c = pos.coords;
    process(c.latitude, c.longitude, pos.timestamp, c.speed, c.heading, c.accuracy);
  }

  function onError(err) {
    if (!s) return;
    gps.status = (err && err.code === 1) ? 'denied' : 'error';
    gps.error = err && err.message ? err.message : 'GPS unavailable';
  }

  /* ---- public API ---- */

  function start(opts) {
    if (s) return false;
    demoMode = !!(opts && opts.demo);
    s = blank(Date.now());
    gps.status = demoMode ? 'ok' : 'acquiring';
    gps.accuracy = null; gps.error = '';

    if (!demoMode) {
      if (!('geolocation' in navigator)) {
        gps.status = 'error'; gps.error = 'Geolocation is not supported on this device';
      } else {
        watchId = navigator.geolocation.watchPosition(onPosition, onError, {
          enableHighAccuracy: true, maximumAge: 0, timeout: 15000
        });
      }
    }
    return true;
  }

  // Simulator entry point — same pipeline as real GPS.
  function injectPosition(pos) {
    if (!s || !demoMode) return;
    onPosition(pos);
  }

  function snapshot() {
    if (!s) return null;
    const elapsed = Date.now() - s.startedAt;
    return {
      demo: demoMode,
      elapsedMs: elapsed,
      movingMs: s.movingMs,
      speedMs: s.speedMs,
      distanceM: s.distanceM,
      maxSpeedMs: s.maxSpeedMs,
      avgSpeedMs: s.movingMs > 3000 ? s.distanceM / (s.movingMs / 1000) : 0,
      accel: s.accel,
      gLat: s.gLat, gLon: s.gLon, maxG: s.maxG,
      heading: s.heading, headingOk: s.headingOk,
      stopped: s.stopped,
      events: { ...s.events },
      samples: s.samples,
      path: s.path,
      gps: { ...gps, stale: !demoMode && s.lastFixAt > 0 && (Date.now() - s.lastFixAt > 8000) }
    };
  }

  function stop() {
    if (!s) return null;
    if (watchId != null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
    const endAt = Date.now();
    const raw = {
      startedAt: s.startedAt,
      endedAt: endAt,
      durationMs: endAt - s.startedAt,
      movingMs: Math.round(s.movingMs),
      distanceM: Math.round(s.distanceM),
      maxSpeedMs: +s.maxSpeedMs.toFixed(2),
      avgSpeedMs: s.movingMs > 3000 ? +(s.distanceM / (s.movingMs / 1000)).toFixed(2) : 0,
      maxG: +s.maxG.toFixed(2),
      events: { ...s.events },
      path: s.path,
      speeds: s.speeds,
      demo: demoMode,
      samples: s.samples
    };
    s = null;
    gps.status = 'off'; gps.accuracy = null;
    demoMode = false;
    return raw;
  }

  const isActive = () => !!s;
  const isDemo = () => demoMode;

  return { start, stop, snapshot, injectPosition, isActive, isDemo, gps };
})();

<script>
/* TripRanked — demo drive simulator.
 *
 * Generates a realistic ~2.5 minute city-to-highway drive in real time and
 * feeds synthetic GeolocationPosition fixes through the exact same tracker
 * pipeline that real GPS uses. Lets you experience the whole app at a desk
 * (or anywhere without GPS permission).
 */
'use strict';

const Simulator = (() => {
  // Each segment ramps speed linearly to `to` m/s over `dur` seconds while
  // turning at `turn` deg/s. The profile is choreographed to trigger a small,
  // predictable set of driving events.
  const SCRIPT = [
    { to: 0,    dur: 3,  turn: 0 },     // parked, engine on
    { to: 13.4, dur: 7,  turn: 0 },     // pull away to 30 mph
    { to: 13.4, dur: 10, turn: 0 },     // city cruise
    { to: 9,    dur: 3,  turn: 0 },     // ease off for the turn
    { to: 9,    dur: 5,  turn: 17 },    // gentle right-hander
    { to: 13.4, dur: 5,  turn: 0 },     // back up to speed
    { to: 0,    dur: 2.6, turn: 0 },    // HARD BRAKE — light went yellow
    { to: 0,    dur: 6,  turn: 0 },     // red light (full stop)
    { to: 15.6, dur: 5,  turn: 0 },     // HARD ACCEL off the line
    { to: 15.6, dur: 8,  turn: 5 },     // sweeping avenue
    { to: 15.6, dur: 7,  turn: -5 },
    { to: 12,   dur: 3,  turn: 0 },
    { to: 12,   dur: 4,  turn: 25 },    // HARD CORNER onto the on-ramp
    { to: 31,   dur: 14, turn: 3 },     // ramp up to 70 mph
    { to: 31,   dur: 12, turn: 0 },     // highway
    { to: 31,   dur: 2,  turn: -5 },    // lane change
    { to: 31,   dur: 2,  turn: 5 },
    { to: 31,   dur: 12, turn: 0 },     // highway
    { to: 17,   dur: 3,  turn: 0 },     // HARD BRAKE — sudden traffic
    { to: 29,   dur: 6,  turn: 0 },     // traffic clears
    { to: 29,   dur: 8,  turn: 0 },
    { to: 10,   dur: 8,  turn: 4 },     // take the exit
    { to: 10,   dur: 4,  turn: 18 },    // exit loop
    { to: 11,   dur: 8,  turn: 0 },     // surface street
    { to: 0,    dur: 5,  turn: 0 },     // arrive
    { to: 0,    dur: 6,  turn: 0 }      // parked
  ];

  const TICK_MS = 400;
  const EARTH = 6371000;

  let timer = null;
  let onDone = null;
  let st = null;

  function start(opts) {
    stopTimer();
    onDone = opts && opts.onDone;
    const rng = U.mulberry32((Date.now() & 0xffffffff) >>> 0);
    st = {
      seg: 0,
      segT: 0,
      v: 0,
      vSeg0: 0,
      heading: 20 + rng() * 320,
      lat: 34.0522 + (rng() - 0.5) * 0.2,   // somewhere around LA
      lon: -118.2437 + (rng() - 0.5) * 0.2,
      rng
    };
    timer = setInterval(tick, TICK_MS);
  }

  function tick() {
    if (!st) return;
    const dt = TICK_MS / 1000;
    const seg = SCRIPT[st.seg];
    if (!seg) { finish(); return; }

    st.segT += dt;
    const f = U.clamp(st.segT / seg.dur, 0, 1);
    st.v = Math.max(0, U.lerp(st.vSeg0, seg.to, f));

    // integrate heading & position
    st.heading = (st.heading + seg.turn * dt + 360) % 360;
    const dist = st.v * dt;
    const rad = Math.PI / 180;
    const dLat = (dist * Math.cos(st.heading * rad)) / EARTH / rad;
    const dLon = (dist * Math.sin(st.heading * rad)) / (EARTH * Math.cos(st.lat * rad)) / rad;
    st.lat += dLat;
    st.lon += dLon;

    // a few meters of GPS jitter, like the real thing
    const jitter = () => (st.rng() - 0.5) * 0.000018;
    const accuracy = 5 + st.rng() * 7;

    Tracker.injectPosition({
      timestamp: Date.now(),
      coords: {
        latitude: st.lat + jitter(),
        longitude: st.lon + jitter(),
        speed: Math.max(0, st.v + (st.rng() - 0.5) * 0.4),
        heading: st.v > 1 ? st.heading : NaN,
        accuracy,
        altitude: null, altitudeAccuracy: null
      }
    });

    if (st.segT >= seg.dur) {
      st.seg++;
      st.segT = 0;
      st.vSeg0 = st.v;
    }
  }

  function finish() {
    stopTimer();
    const cb = onDone; onDone = null; st = null;
    if (cb) cb();
  }

  function stopTimer() {
    if (timer) { clearInterval(timer); timer = null; }
  }

  function stop() { stopTimer(); onDone = null; st = null; }

  const isRunning = () => !!timer;

  return { start, stop, isRunning };
})();
