<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sprkwash – Business Card Front</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #e8edf2;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'DM Sans', sans-serif;
    }

    /* Standard business card: 3.5in × 2in at 96dpi = 336 × 192px
       We scale up 2.5× for screen: 840 × 480px */
    .card {
      width: 840px;
      height: 480px;
      border-radius: 24px;
      background: #0B1D3A;
      position: relative;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    }

    .accent-bar {
      position: absolute;
      top: 0; left: 0;
      width: 9px; height: 100%;
      background: #1D6FE8;
      border-radius: 24px 0 0 24px;
    }

    .dots {
      position: absolute;
      top: 0; right: 0;
      opacity: 0.08;
    }

    .wave {
      position: absolute;
      bottom: -16px; left: -40px;
      opacity: 0.13;
    }

    .content {
      position: relative;
      z-index: 2;
      padding: 56px 66px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Logo */
    .logo-lockup { display: flex; align-items: center; gap: 18px; }
    .logo-icon {
      width: 64px; height: 64px;
      background: #1D6FE8;
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .logo-text {
      font-family: 'Syne', sans-serif;
      font-size: 40px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -1px;
      line-height: 1;
    }
    .logo-text span { color: #60A5FA; }
    .tagline {
      font-size: 13px;
      color: rgba(255,255,255,0.4);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-top: 6px;
    }

    /* Bottom row */
    .bottom { display: flex; justify-content: space-between; align-items: flex-end; }

    .name-block .name {
      font-family: 'Syne', sans-serif;
      font-size: 26px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.3px;
    }
    .name-block .role {
      font-size: 13px;
      color: rgba(255,255,255,0.4);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-top: 5px;
    }

    .contact { display: flex; flex-direction: column; gap: 7px; align-items: flex-end; }
    .contact-line { font-size: 14px; color: rgba(255,255,255,0.5); }

    /* Print styles */
    @media print {
      body { background: white; margin: 0; }
      .card {
        width: 3.5in; height: 2in;
        border-radius: 0;
        box-shadow: none;
      }
      .content { padding: 0.22in 0.26in; }
      .logo-icon { width: 0.42in; height: 0.42in; border-radius: 0.08in; }
      .logo-text { font-size: 0.26in; }
      .tagline { font-size: 0.07in; }
      .name-block .name { font-size: 0.17in; }
      .name-block .role { font-size: 0.07in; }
      .contact-line { font-size: 0.08in; }
      .accent-bar { width: 0.06in; }
    }
  </style>
</head>
<body>

<div class="card">
  <div class="accent-bar"></div>

  <!-- Dot pattern -->
  <svg class="dots" width="200" height="200" viewBox="0 0 200 200">
    <defs>
      <pattern id="dp" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
        <circle cx="2" cy="2" r="2" fill="white"/>
      </pattern>
    </defs>
    <rect width="200" height="200" fill="url(#dp)"/>
  </svg>

  <!-- Wave -->
  <svg class="wave" width="680" height="300" viewBox="0 0 680 300" fill="none">
    <path d="M0 150 C130 60, 260 240, 390 150 S580 60, 680 150 L680 300 L0 300 Z" fill="#1D6FE8"/>
  </svg>

  <div class="content">
    <!-- Logo -->
    <div class="logo-lockup">
      <div class="logo-icon">
        <svg width="34" height="34" viewBox="0 0 34 34" fill="none">
          <path d="M17 4 C17 4, 7 13, 7 20 A10 10 0 0 0 27 20 C27 13 17 4 17 4Z" fill="white" opacity="0.95"/>
          <path d="M12 23 Q17 29 22 23" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>
        </svg>
      </div>
      <div>
        <div class="logo-text">sprk<span>wash</span></div>
        <div class="tagline">Professional Pressure Washing</div>
      </div>
    </div>

    <!-- Bottom -->
    <div class="bottom">
      <div class="name-block">
        <div class="name">Your Name Here</div>
        <div class="role">Co-Founder</div>
      </div>
      <div class="contact">
        <div class="contact-line">sprkwash.netlify.app</div>
        <div class="contact-line">(512) 555-0100</div>
        <div class="contact-line">Austin, TX</div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
