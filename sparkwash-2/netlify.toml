# netlify.toml — SparkWash configuration

[build]
  publish = "."   # The root folder is what gets deployed

# Redirect everything to index.html (single-page site)
[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
